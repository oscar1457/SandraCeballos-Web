# Manual (pestaña Actions → «Actualizar referencias» → Run workflow).
# Regenera en el mismo entorno que CI las capturas aprobadas y la referencia de
# Lighthouse, y las deja como artefacto para revisarlas antes de subirlas.
# No cambia nada en el repositorio por sí solo: una persona revisa y hace commit.
name: Actualizar referencias

on:
  workflow_dispatch:

jobs:
  references:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:browsers
      - name: Capturas aprobadas nuevas
        run: npm run test:update-visual
      - name: Referencia de Lighthouse nueva
        run: npm run test:lighthouse:update
      - uses: actions/upload-artifact@v4
        with:
          name: referencias-nuevas
          path: |
            tests/visual/
            tests/lighthouse-baseline.json
