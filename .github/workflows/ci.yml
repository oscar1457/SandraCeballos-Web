# Se ejecuta en cada push y en cada pull request: tipos, build y todos los tests
# (funcionales, News, movimiento, accesibilidad, responsive, regresión visual,
# WebKit/Safari y Lighthouse). Si algo falla, el informe queda como artefacto.
name: Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "1"
      WEBKIT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dependencias (bloqueadas por package-lock.json)
        run: npm ci

      - name: Tipos, build, navegadores y tests (Chromium + visual)
        run: npm run verify

      - name: WebKit (motor de Safari)
        run: npm run test:webkit

      - name: Lighthouse contra la referencia aprobada
        run: npm run test:lighthouse

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
